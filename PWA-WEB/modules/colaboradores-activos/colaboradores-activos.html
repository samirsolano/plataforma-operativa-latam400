<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Colaboradores Activos - Plataforma Operativa
    </title>

    <link
        rel="stylesheet"
        href="colaboradores-activos.css"
    >

</head>

<body>

    <div class="contenedor">

        <header class="header">

            <div>

                <a href="../check-list-5s/check-list-5s.html" class="volver">
                    ← Volver a Check List 5S
                </a>

                <h1>
                    Colaboradores Activos
                </h1>

            </div>

            <button id="btnAgregar" class="btn-primario">
                + Agregar Colaborador
            </button>

        </header>

        <div class="card">

            <div class="buscador">

                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar por DNI o nombre..."
                    autocomplete="off"
                >

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Foto</th>
                        <th>DNI</th>
                        <th>Nombre</th>
                        <th>Zona</th>
                        <th>Pasillo</th>
                        <th>Turno</th>
                        <th>Estado</th>
                        <th>Acción</th>

                    </tr>

                </thead>

                <tbody id="tblActivos">
                </tbody>

            </table>

            <p id="mensajeVacio" class="mensaje-vacio">
                Cargando colaboradores...
            </p>

        </div>

    </div>

    <!-- MODAL AGREGAR / EDITAR -->

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <h3 id="tituloModal">
                Agregar Colaborador
            </h3>

            <form autocomplete="off" onsubmit="return false;">

                <div class="grupo">

                    <label>
                        DNI
                    </label>

                    <input
                        type="text"
                        id="nuevoDni"
                        maxlength="8"
                        inputmode="numeric"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nuevoNombre"
                        autocomplete="off"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Zona
                    </label>

                    <select id="nuevoZona">
                        <option value="">Seleccione...</option>
                        <option value="ZONA 1">ZONA 1</option>
                        <option value="ZONA 2">ZONA 2</option>
                        <option value="ZONA 3">ZONA 3</option>
                        <option value="ZONA 4">ZONA 4</option>
                        <option value="ZONA 5">ZONA 5</option>
                        <option value="ZONA 6">ZONA 6</option>
                    </select>

                </div>

                <div class="grupo">

                    <label>
                        Pasillo
                    </label>

                    <input
                        type="text"
                        id="nuevoPasillo"
                        placeholder="Ej: Pasillo 5"
                        autocomplete="off"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Turno
                    </label>

                    <select id="nuevoTurno">
                        <option value="">Seleccione...</option>
                        <option value="DIA">DIA</option>
                        <option value="NOCHE">NOCHE</option>
                        <option value="INTERMEDIO">INTERMEDIO</option>
                    </select>

                </div>

                <div class="grupo">

                    <label>
                        Supervisor
                    </label>

                    <input
                        type="text"
                        id="nuevoSupervisor"
                        autocomplete="off"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Foto
                    </label>

                    <p id="fotoEncontradaMsg" class="mensaje-foto-encontrada"></p>

                    <input
                        type="file"
                        id="nuevoFoto"
                        accept="image/*"
                    >

                    <img
                        id="previsualizacionFoto"
                        class="previsualizacion"
                        alt="Vista previa"
                    >

                </div>

                <div class="grupo grupo-checkbox">

                    <label>

                        <input
                            type="checkbox"
                            id="nuevoActivo"
                            checked
                        >

                        Colaborador activo

                    </label>

                </div>

                <p id="mensajeErrorModal" class="mensaje-error"></p>

                <div class="modal-botones">

                    <button type="button" id="btnCancelar" class="btn-secundario">
                        Cancelar
                    </button>

                    <button type="button" id="btnGuardar" class="btn-primario">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../../shared/supabase-config.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="../../shared/colaboradores-fotos.js"></script>
    <script src="colaboradores-activos.js"></script>

</body>

</html>
