<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Plataforma Operativa
    </title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <div class="contenedor-login">

        <div class="card-login">

            <img
                src="../../shared/assets/sigma-logo-solid.png"
                alt="Sigma"
                class="logo-sigma-login"
            >

            <h1>
                PLATAFORMA OPERATIVA
            </h1>

            <h2>
                LATAM 400 CL - ALICORP
            </h2>

            <form
                autocomplete="off"
                onsubmit="return false;"
            >

                <div class="grupo">

                    <label>
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario_latam400"
                        placeholder="Ingrese usuario"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password_latam400"
                        placeholder="Ingrese contraseña"
                        autocomplete="new-password"
                    >

                </div>

                <p id="mensajeError" class="mensaje-error"></p>

                <button
                    type="button"
                    id="btnIngresar"
                >

                    INGRESAR

                </button>

            </form>

        </div>

    </div>

    <script src="../../shared/supabase-config.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="login.js"></script>

</body>

</html>
