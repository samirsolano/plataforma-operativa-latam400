<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Lista de Equipos - Plataforma Operativa
    </title>

    <link
        rel="stylesheet"
        href="../../shared/checklist-sidebar.css"
    >

    <link
        rel="stylesheet"
        href="checklist-equipos.css"
    >

</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <a href="../inicio/home.html" class="volver-plataforma">
                ← Volver a la Plataforma
            </a>

            <div class="logo">
                <h1>LISTA DE</h1>
                <h1>EQUIPOS</h1>
                <span>LATAM 400 CL</span>
            </div>

            <div class="perfil-sidebar" id="btnPerfil">

                <div class="nombre-sidebar" id="nombreUsuario">-</div>
                <div class="rol-sidebar" id="rolUsuario">-</div>

                <div class="menu-usuario" id="menuUsuario">
                    <a href="#">Cambiar Contraseña</a>
                    <a href="#" id="btnCerrarSesion">Cerrar Sesión</a>
                </div>

            </div>

            <nav class="menu">
                <a href="checklist-equipos.html" class="activo">Lista de Equipos</a>
            </nav>

        </aside>

    <main class="contenido">

    <div class="contenedor">

        <header class="header">

            <div>

                <h1>
                    Lista de Equipos
                </h1>

            </div>

            <button id="btnAgregar" class="btn-primario">
                + Agregar MHE
            </button>

        </header>

        <div class="card">

            <div class="filtros">

                <div class="buscador">

                    <input
                        type="text"
                        id="buscador"
                        placeholder="Buscar por serie..."
                        autocomplete="off"
                    >

                </div>

                <select id="filtroEstado">
                    <option value="">Estado (todos)</option>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>

                <select id="filtroNombre">
                    <option value="">Nombre (todos)</option>
                </select>

            </div>

            <div class="tabla-scroll">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Estado</th>
                            <th>Local</th>
                            <th>Nombre</th>
                            <th>Serie</th>
                            <th>Foto</th>
                            <th>Actualizado el</th>
                            <th>Actualizado por</th>
                            <th>Editar</th>

                        </tr>

                    </thead>

                    <tbody id="tblEquipos">
                    </tbody>

                </table>

            </div>

            <p id="mensajeVacio" class="mensaje-vacio">
                Cargando equipos...
            </p>

        </div>

    </div>

    </main>

    </div>

    <!-- MODAL AGREGAR / EDITAR -->

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <h3 id="tituloModal">
                Agregar MHE
            </h3>

            <form autocomplete="off" onsubmit="return false;">

                <div class="grupo">

                    <label>
                        Foto
                    </label>

                    <input
                        type="file"
                        id="nuevoFoto"
                        accept="image/*"
                    >

                    <img
                        id="previsualizacionFoto"
                        class="previsualizacion"
                        alt="Vista previa"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Estado
                    </label>

                    <select id="nuevoEstado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>

                </div>

                <div class="grupo">

                    <label>
                        Nombre
                    </label>

                    <select id="nuevoNombre">
                        <option value="Apilador Eléctrico">Apilador Eléctrico</option>
                        <option value="Montacarga">Montacarga</option>
                        <option value="Transpaleta Eléctrica">Transpaleta Eléctrica</option>
                    </select>

                </div>

                <div class="grupo">

                    <label>
                        Serie
                    </label>

                    <input
                        type="text"
                        id="nuevaSerie"
                        placeholder="Ej: 1259"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Local
                    </label>

                    <input
                        type="text"
                        id="nuevoLocal"
                        value="LATAM"
                    >

                </div>

                <p id="mensajeErrorModal" class="mensaje-error"></p>

                <div class="modal-botones">

                    <button type="button" id="btnCancelar" class="btn-secundario">
                        Cancelar
                    </button>

                    <button type="button" id="btnGuardar" class="btn-primario">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../../shared/supabase-config.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="../../shared/checklist-config.js"></script>
    <script src="checklist-equipos.js"></script>

</body>

</html>
