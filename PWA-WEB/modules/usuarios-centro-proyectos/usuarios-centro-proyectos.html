<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Usuarios Centro de Proyectos - Plataforma Operativa
    </title>

    <link
        rel="stylesheet"
        href="usuarios-centro-proyectos.css"
    >

</head>

<body>

    <div class="contenedor">

        <header class="header">

            <div>

                <a href="../inicio/home.html" class="volver">
                    ← Volver al Panel
                </a>

                <h1>
                    Usuarios Centro de Proyectos
                </h1>

            </div>

            <button id="btnAgregar" class="btn-primario">
                + Agregar Usuario
            </button>

        </header>

        <div class="card">

            <div class="buscador">

                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar por DNI o nombre..."
                    autocomplete="off"
                >

            </div>

            <table>

                <thead>

                    <tr>

                        <th>DNI</th>
                        <th>Nombre completo</th>
                        <th>Puesto</th>
                        <th>JD</th>
                        <th>Estado</th>
                        <th>Acción</th>

                    </tr>

                </thead>

                <tbody id="tblUsuarios">
                </tbody>

            </table>

            <p id="mensajeVacio" class="mensaje-vacio">
                Cargando usuarios...
            </p>

        </div>

    </div>

    <!-- MODAL AGREGAR USUARIO -->

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <h3>
                Agregar Usuario
            </h3>

            <form autocomplete="off" onsubmit="return false;">

                <div class="grupo">

                    <label>
                        DNI
                    </label>

                    <input
                        type="text"
                        id="nuevoDni"
                        maxlength="8"
                        inputmode="numeric"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nuevoNombre"
                        autocomplete="off"
                    >

                </div>

                <div class="grupo">

                    <label>
                        Puesto
                    </label>

                    <input
                        type="text"
                        id="nuevoPuesto"
                        autocomplete="off"
                    >

                </div>

                <div class="grupo">

                    <label>
                        JD (Jefe Directo)
                    </label>

                    <input
                        type="text"
                        id="nuevoJd"
                        autocomplete="off"
                    >

                </div>

                <div class="grupo grupo-checkbox">

                    <label>

                        <input
                            type="checkbox"
                            id="nuevoActivo"
                            checked
                        >

                        Usuario activo

                    </label>

                </div>

                <p id="mensajeErrorModal" class="mensaje-error"></p>

                <div class="modal-botones">

                    <button type="button" id="btnCancelar" class="btn-secundario">
                        Cancelar
                    </button>

                    <button type="button" id="btnGuardar" class="btn-primario">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../../shared/supabase-config.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="usuarios-centro-proyectos.js"></script>

</body>

</html>
